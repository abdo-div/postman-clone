name: Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      # Spin up ephemeral Redis container for BullMQ testing
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Spin up ephemeral MongoDB container for Schema testing
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: TypeScript Type Check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run Vitest Suites
        working-directory: backend
        env:
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          MONGODB_URI: mongodb://localhost:27017/api_engine_test
        run: npm run test

      - name: Verify Production Build
        working-directory: backend
        run: npm run build