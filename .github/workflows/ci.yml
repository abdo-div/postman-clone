name: Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      # Spin up ephemeral Redis container for BullMQ testing
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Spin up ephemeral MongoDB container for Schema testing
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------------------------------------------------------------
      # Backend
      # ---------------------------------------------------------------
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: TypeScript Type Check (Backend)
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run Vitest Suites
        working-directory: backend
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/api_engine_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci_test_secret_at_least_32_characters_long_123
        run: npm run test

      - name: Verify Production Build (Backend)
        working-directory: backend
        run: npm run build

      # ---------------------------------------------------------------
      # Frontend
      # ---------------------------------------------------------------
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (Frontend)
        working-directory: frontend
        run: npm run lint

      - name: Type Check + Build (Frontend)
        working-directory: frontend
        run: npm run build